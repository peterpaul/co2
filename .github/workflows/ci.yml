name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Stage 1: translate .co2 -> .c once, on Linux, and package the results as
  # dist tarballs. Every other job just builds a plain C toolchain against
  # these -- no carbon/bootstrap dance repeated per platform. See
  # .github/scripts/translate.sh and TODO.md item #1.
  translate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool bison flex pkg-config

      - name: Resolve CC
        run: echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Translate
        env:
          WORKDIR: ${{ runner.temp }}/co2-translate
          OUTDIR: ${{ runner.temp }}/co2-dist
        run: bash .github/scripts/translate.sh

      - name: Upload dist tarballs
        uses: actions/upload-artifact@v7
        with:
          name: dist-tarballs
          path: ${{ runner.temp }}/co2-dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  # Stage 2: build + test everything with each platform's own native C
  # toolchain, consuming Stage 1's pre-translated dist tarballs for co2-base
  # and carbon (co2/libco2 is pure C, built straight from the checkout).
  # Extensible: adding a new platform/architecture is just a new matrix
  # entry running the same script, no new bootstrap-patching work.
  build-and-test:
    needs: translate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download dist tarballs
        uses: actions/download-artifact@v8
        with:
          name: dist-tarballs
          path: ${{ runner.temp }}/co2-dist

      # Windows: build everything inside MSYS2/MinGW64, since carbon's
      # generated code needs GNU nested functions (see TODO.md item #3),
      # which MSVC doesn't support and Clang has never implemented.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            autoconf
            automake
            libtool
            bison
            flex
            pkgconf
            make
            tar
            curl

      # bison/flex are only genuinely needed here for co2 (libco2)'s own
      # ./autogen.sh -- co2-base/carbon's dist tarballs already bundle
      # pre-generated grammar.c/lex.c (autoreconf output baked in by Stage
      # 1's `make dist`), and automake's standard yacc/lex dist-tarball
      # support is a well-established mechanism for not needing bison/flex
      # downstream. Kept installed here regardless, since that specific
      # no-bison/flex-needed path hasn't been verified end-to-end the way
      # the CARBON_EXISTS=false path was -- worth revisiting once confirmed.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool bison flex pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc autoconf automake libtool bison flex pkg-config

      - name: Resolve CC (Linux)
        if: runner.os == 'Linux'
        run: echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Resolve CC (macOS)
        if: runner.os == 'macOS'
        # The homebrew gcc formula's binary is versioned (gcc-14, gcc-15, ...)
        # and the version isn't stable across runner images, so resolve it
        # rather than hardcoding a number.
        run: |
          GCC_BIN=$(ls "$(brew --prefix gcc)/bin" | grep -E '^gcc-[0-9]+$' | sort -V | tail -1)
          echo "CC=$(brew --prefix gcc)/bin/${GCC_BIN}" >> "$GITHUB_ENV"

      - name: Resolve CC (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Resolve DISTDIR (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # download-artifact resolves runner.temp in the native Windows/Node
        # context (correct for its own use), but the downstream build step
        # runs inside MSYS2 -- same category of path-mangling risk that hit
        # WORKDIR before (see the comment on the Windows build-and-test step
        # below), so convert it to a proper MSYS2 POSIX path with cygpath
        # rather than assume the raw Windows-style path works everywhere.
        run: echo "DISTDIR=$(cygpath -u '${{ runner.temp }}')/co2-dist" >> "$GITHUB_ENV"

      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          WORKDIR: ${{ runner.temp }}/co2-ci
          DISTDIR: ${{ runner.temp }}/co2-dist
        run: bash .github/scripts/build-and-test.sh

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # runner.temp resolves to a Windows-style path (D:\a\_temp) that,
          # once mixed with forward slashes and passed through MSYS2's
          # POSIX<->Windows path conversion, comes out mangled (libtool's
          # -rpath handling has seen it collapse to "D:a_temp/..." with the
          # separators dropped). Use a plain MSYS2-native path instead --
          # entirely within one path universe, nothing to convert. DISTDIR
          # is set via GITHUB_ENV by the "Resolve DISTDIR (Windows)" step
          # above (same cygpath-conversion reasoning).
          WORKDIR: /tmp/co2-ci
        run: bash .github/scripts/build-and-test.sh
